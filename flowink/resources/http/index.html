-width:4px 0 4px 5px;border-left-color:currentColor}.step-btn.dir-up::before{border-width:0 4px 5px 4px;border-bottom-color:currentColor}.step-btn.dir-down::before{border-width:5px 4px 0 4px;border-top-color:currentColor}.step-btn:hover{background:#FBE9C8;border-color:#E5CE9C}.step-btn:active{transform:scale(.94);background:#F6E0B4}.step-btn:disabled{opacity:.35;cursor:default;transform:none;background:var(--line-soft)}.help{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:14px;height:14px;border-radius:50%;background:var(--line-soft);border:1px solid var(--line);color:var(--ink-2);font-size:10px;font-weight:600;line-height:1;cursor:help;user-select:none;transition:.15s ease}.help:hover,.help:focus-visible{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink)}.help::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);width:180px;padding:8px 10px;background:var(--ink);color:#fff;font-size:11px;font-weight:400;line-height:1.6;letter-spacing:0;text-align:left;white-space:pre-line;border-radius:var(--radius-sm);box-shadow:0 8px 22px rgba(47,59,58,.2);opacity:0;visibility:hidden;transition:opacity .15s ease;pointer-events:none;z-index:20}.help-r::after{left:auto;right:-4px;transform:none}.help-r::before{left:auto;right:2px;transform:none}.help::before{content:'';position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--ink);opacity:0;visibility:hidden;transition:opacity .15s ease;pointer-events:none;z-index:21}.help:hover::after,.help:hover::before,.help:focus-visible::after,.help:focus-visible::before{opacity:1;visibility:visible}.preview-card{flex:1 1 auto;display:flex;flex-direction:column;background:var(--card);border:1px solid #F4EFE6;border-radius:21px;padding:10px 12px 12px;box-shadow:var(--shadow-sm)}.panel-label{display:flex;align-items:center;gap:6px;padding:0 2px 8px;f
